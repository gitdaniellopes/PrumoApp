[versions]
# --- BUILD ---
agp = "9.0.1"
kotlin = "2.3.21"

# --- ANDROID SDK ---
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# --- ANDROIDX ---
androidx-activity = "1.13.0"
androidx-core = "1.18.0"
androidx-credentials = "1.6.0"
androidx-lifecycle = "2.11.0-beta01"
androidx-navigation = "2.9.2"
androidx-splashscreen = "1.2.0"

# --- COMPOSE MULTIPLATFORM ---
composeMultiplatform = "1.11.0"
material3 = "1.11.0-alpha07"
material3WindowSizeClass = "1.9.0"

# --- KOTLINX ---
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-collections-immutable = "0.4.0"
kotlinx-datetime = "0.8.0"

# --- DI ---
koin-bom = "4.2.1"

# --- FIREBASE ---
firebase-bom = "34.13.0"
firebaseGitLive = "2.4.0"

# --- GOOGLE ---
google-id = "1.2.0"
google-services = "4.4.4"

# --- EXTERNAL LIBS ---
napier = "2.7.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# --- ANDROIDX ---
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }

# --- LIFECYCLE ---
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# --- COMPOSE MULTIPLATFORM ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
material3-window-size-class1 = { module = "org.jetbrains.compose.material3:material3-window-size-class", version.ref = "material3WindowSizeClass" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# --- KOIN (BOM) ---
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation" }

# --- KOTLINX ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# --- EXTERNAL LIBS ---
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "google-id" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "firebaseGitLive" }
firebase-firestore = { module = "dev.gitlive:firebase-firestore", version.ref = "firebaseGitLive" }
firebase-messaging = { module = "dev.gitlive:firebase-messaging", version.ref = "firebaseGitLive" }
firebase-storage = { module = "dev.gitlive:firebase-storage", version.ref = "firebaseGitLive" }
firebase-app = { module = "dev.gitlive:firebase-app", version.ref = "firebaseGitLive" }

# --- TESTING ---
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }